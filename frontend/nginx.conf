server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service (Compose network),
    # so the Angular app can call relative /api/* paths with no CORS setup.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (STOMP) endpoint for the agent activity/alert feed (Phase 6).
    # No trailing slash on either side: nginx passes the matched suffix straight
    # through to backend:8080/ws, so a client connecting to exactly /ws (the
    # Spring STOMP endpoint's own path, no SockJS suffix) resolves correctly.
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
