databases:
  - name: moveinsync-db
    plan: free
    databaseName: moveinsync
    user: moveinsync

services:
  - type: web
    name: moveinsync-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: moveinsync-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: moveinsync-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: moveinsync-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: moveinsync-db
          property: password
      - key: DATA_SOURCE_DIR
        value: /data
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_MODEL
        value: sarvam-105b-conversations
      # Secrets: not stored in this file. Set these manually in the Render
      # dashboard after the Blueprint is applied (Service -> Environment).
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: moveinsync-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Render's free web services can SEND private-network requests but
      # can't RECEIVE them (https://render.com/docs/private-network), so two
      # free services (this frontend and moveinsync-backend) can never reach
      # each other via the private "host:port" form - it will never resolve.
      # Instead, route over the backend's public onrender.com URL: an
      # ordinary outbound HTTPS call, unaffected by that restriction, while
      # still keeping the browser's own requests same-origin (nginx does the
      # extra hop server-side - see nginx.conf.template).
      - key: BACKEND_SCHEME
        value: https
      # fromService's "host" property gives the backend's Render-assigned
      # slug (e.g. "moveinsync-backend-2bot") with no port - the same slug
      # Render uses for its public onrender.com subdomain.
      - key: BACKEND_HOST
        fromService:
          name: moveinsync-backend
          type: web
          property: host
      - key: BACKEND_DOMAIN_SUFFIX
        value: .onrender.com
