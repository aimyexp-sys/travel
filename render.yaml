databases:
  - name: moveinsync-db
    plan: free
    databaseName: moveinsync
    user: moveinsync

services:
  - type: web
    name: moveinsync-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: moveinsync-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: moveinsync-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: moveinsync-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: moveinsync-db
          property: password
      - key: DATA_SOURCE_DIR
        value: /data
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_MODEL
        value: sarvam-105b-conversations
      # Secrets: not stored in this file. Set these manually in the Render
      # dashboard after the Blueprint is applied (Service -> Environment).
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: moveinsync-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Resolves over Render's private network as "<service>:<port>", so the
      # frontend's nginx reverse-proxy reaches the backend without a public
      # URL, without CORS, and without hardcoding a Render hostname.
      - key: BACKEND_HOSTPORT
        fromService:
          name: moveinsync-backend
          type: web
          property: hostport
